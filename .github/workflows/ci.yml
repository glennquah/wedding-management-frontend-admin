name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build artifacts
        run: |
          npx turbo clean
          find . -name "*.tsbuildinfo" -type f -delete
          find . -name ".next" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build
