<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Knotly Password</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f8f9fa;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .header {
        background: linear-gradient(135deg, #ff5a5f 0%, #45292f 100%);
        padding: 40px 20px;
        text-align: center;
      }

      .logo {
        font-size: 32px;
        font-weight: bold;
        color: #ffffff !important;
        text-decoration: none;
        letter-spacing: 1px;
        display: block;
        text-align: center;
        margin: 0 auto;
      }

      .logo-img {
        width: 150px;
        height: 50px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }

      .tagline {
        color: #ffffff;
        font-size: 14px;
        margin-top: 8px;
        opacity: 0.9;
      }

      .content {
        padding: 40px 30px;
      }

      .greeting {
        font-size: 24px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .message {
        font-size: 16px;
        line-height: 1.7;
        color: #555;
        margin-bottom: 30px;
      }

      .cta-container {
        text-align: center;
        margin: 40px 0;
      }

      .cta-button {
        display: inline-block;
        background: linear-gradient(135deg, #ff5a5f 0%, #da3c41 100%) !important;
        color: #ffffff !important;
        text-decoration: none !important;
        padding: 16px 32px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: transform 0.2s ease;
        box-shadow: 0 4px 15px rgba(255, 90, 95, 0.3);
        border: none !important;
      }

      .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 90, 95, 0.4);
      }

      .divider {
        height: 1px;
        background: linear-gradient(to right, transparent, #e0e0e0, transparent);
        margin: 30px 0;
      }

      .footer {
        background-color: #f8f9fa;
        padding: 30px;
        text-align: center;
        border-top: 1px solid #e9ecef;
      }

      .footer-logo {
        font-size: 18px;
        font-weight: bold;
        color: #ff5a5f;
        margin-bottom: 10px;
      }

      .footer-text {
        font-size: 14px;
        color: #6c757d;
        margin-bottom: 15px;
      }

      .social-links {
        margin: 20px 0;
      }

      .social-link {
        display: inline-block;
        margin: 0 10px;
        color: #ff5a5f;
        text-decoration: none;
        font-size: 14px;
      }

      .unsubscribe {
        font-size: 12px;
        color: #adb5bd;
        margin-top: 20px;
      }

      .unsubscribe a {
        color: #ff5a5f;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .email-container {
          margin: 0;
          border-radius: 0;
        }

        .content {
          padding: 30px 20px;
        }

        .header {
          padding: 30px 20px;
        }

        .greeting {
          font-size: 20px;
        }

        .cta-button {
          padding: 14px 28px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <!-- Header -->
      <div class="header">
        <div style="text-align: center">
          <img
            src="https://res.cloudinary.com/doudbsnya/image/upload/v1758432610/logo_ptrwb6.png"
            alt="Knotly Logo"
            class="logo-img"
          />
        </div>
        <div class="tagline">Your Perfect Wedding, Perfectly Planned</div>
      </div>

      <!-- Main Content -->
      <div class="content">
        <div class="greeting">Hello {{name}}!</div>

        <div class="message">
          <!-- Main Content Text -->
          Enter Main Text Here
        </div>

        <div class="cta-container">
          <!-- Main Content Button -->
          <a href="{{buttonUrl}}" class="cta-button">Enter Button Text</a>
        </div>

        <div class="divider"></div>

        <div class="message">
          <!-- Additional Content Text -->
          Enter Additional Text Here
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <a href="https://knotly.app" class="logo">
          <img
            src="https://res.cloudinary.com/doudbsnya/image/upload/v1758432610/logo_ptrwb6.png"
            alt="Knotly Logo"
            class="logo-img"
          />
        </a>
        <div class="footer-text">Making your dream wedding a reality, one detail at a time.</div>

        <div class="social-links">
          <a href="https://knotly.app" class="social-link">Website</a>
          <a href="https://knotly.app/support" class="social-link">Support</a>
          <a href="mailto:hello@knotly.app" class="social-link">Contact</a>
        </div>
      </div>
    </div>
  </body>
</html>
