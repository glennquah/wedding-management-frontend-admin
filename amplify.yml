version: 1
applications:
  - appRoot: apps/external
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for monorepo..."
            - npm ci
            - echo "Building shared packages..."
        build:
          commands:
            - echo "Building external app (knotly.app)..."
            - npm run build:external
      artifacts:
        baseDirectory: apps/external/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/external/.next/cache/**/*
      buildSettings:
        commands: []
        baseDirectory: apps/external

  - appRoot: apps/internal
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for monorepo..."
            - npm ci
            - echo "Building shared packages..."
        build:
          commands:
            - echo "Building internal app (core.knotly.app)..."
            - npm run build:internal
      artifacts:
        baseDirectory: apps/internal/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/internal/.next/cache/**/*
      buildSettings:
        commands: []
        baseDirectory: apps/internal
