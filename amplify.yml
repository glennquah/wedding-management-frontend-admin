version: 1
applications:
  - appRoot: apps/external
    frontend:
      phases:
        preBuild:
          commands:
            - echo "🚀 Installing dependencies for monorepo..."
            - npm ci
            - echo "📦 Dependencies installed successfully"
        build:
          commands:
            - echo "🏗️ Building external app (knotly.app)..."
            - npm run build:external
            - echo "✅ External app build completed"
      artifacts:
        baseDirectory: apps/external/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/external/.next/cache/**/*

  - appRoot: apps/internal
    frontend:
      phases:
        preBuild:
          commands:
            - echo "🚀 Installing dependencies for monorepo..."
            - npm ci
            - echo "📦 Dependencies installed successfully"
        build:
          commands:
            - echo "🏗️ Building internal app (core.knotly.app)..."
            - npm run build:internal
            - echo "✅ Internal app build completed"
      artifacts:
        baseDirectory: apps/internal/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/internal/.next/cache/**/*
