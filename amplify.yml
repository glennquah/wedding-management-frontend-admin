version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - echo "🚀 Installing dependencies for monorepo..."
            - npm ci
            - echo "📦 Dependencies installed successfully"
        build:
          commands:
            - echo "🏗️ Building external app (knotly.app)..."
            - echo "🔧 Exporting environment variables..."
            - export NEXTAUTH_SECRET=$NEXTAUTH_SECRET
            - export NEXT_PUBLIC_NEXTAUTH_URL=$NEXT_PUBLIC_NEXTAUTH_URL
            - export GITHUB_ID=$GITHUB_ID
            - export GITHUB_SECRET=$GITHUB_SECRET
            - export OPENAI_API_KEY=$OPENAI_API_KEY
            - export NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
            - export NEXT_PUBLIC_CLOUDINARY_PRESET_NAME=$NEXT_PUBLIC_CLOUDINARY_PRESET_NAME
            - npm run build:external
            - echo "✅ External app build completed"
      artifacts:
        baseDirectory: apps/external/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/external/.next/cache/**/*
